services:
  postgres:
    image: postgres:16-alpine
    container_name: torito-fresh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: torito
      POSTGRES_PASSWORD: torito
      POSTGRES_DB: torito_fresh
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '6543:5432'
    volumes:
      - torito_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U torito -d torito_fresh']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  torito_postgres_data:
